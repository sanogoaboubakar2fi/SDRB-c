<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpeedConnect — Supervision SDRB</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1f3a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SpeedConnect">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --navy-deep:#050d1a;
  --navy:#0b1f3a;
  --navy-panel:#16304f;
  --navy-panel-2:#1a3968;
  --navy-line:#2a4670;
  --navy-line-soft:#1c3459;
  --orange:#ff7a1a;
  --orange-dim:#ff9a4d;
  --orange-soft:#ffb27a;
  --bg:#0a1526;
  --bg-card:#101f38;
  --bg-card-hover:#132745;
  --ink:#e7ecf5;
  --ink-dim:#8b98b3;
  --line:#233b60;
  --ok:#2ecc71;
  --warn:#f5a623;
  --crit:#ff5b60;
  --off:#8b93a3;
  --radius:10px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'IBM Plex Sans',sans-serif;
  overflow-x:hidden;
}
h1,h2,h3,.display{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.02em;}
.mono{font-family:'IBM Plex Mono',monospace;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* ---------- LAYOUT ---------- */
#appShell{display:flex;min-height:100vh;}

/* Sidebar */
.sidebar{
  width:230px;flex-shrink:0;
  background:var(--navy-deep);
  color:#c7d0de;
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
  transition:width .22s ease;
  z-index:40;
  border-right:1px solid var(--navy-line);
}
.sidebar.collapsed{width:64px;}
.sb-head{
  display:flex;align-items:center;gap:10px;
  padding:18px 16px;border-bottom:1px solid var(--navy-line);
  min-height:64px;
}
.sb-logo{
  width:34px;height:34px;border-radius:7px;
  background:linear-gradient(155deg,var(--orange),var(--orange-dim));
  display:flex;align-items:center;justify-content:center;
  font-family:'Oswald',sans-serif;font-weight:700;color:#fff;font-size:15px;
  flex-shrink:0;
}
.sb-title{font-family:'Oswald',sans-serif;font-weight:600;font-size:15px;letter-spacing:0.06em;color:#fff;white-space:nowrap;overflow:hidden;}
.sb-title small{display:block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--orange-soft);letter-spacing:0.1em;text-transform:none;}
.sidebar.collapsed .sb-title{display:none;}
.sb-toggle{
  margin-left:auto;background:none;border:none;color:#8895ab;font-size:16px;padding:6px;border-radius:6px;flex-shrink:0;
}
.sb-toggle:hover{background:var(--navy-panel);color:#fff;}
.sidebar.collapsed .sb-head{justify-content:center;padding:18px 10px;}
.sidebar.collapsed .sb-toggle{margin-left:0;}

.sb-nav{flex:1;overflow-y:auto;padding:14px 10px;}
.sb-section-label{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.14em;color:#5e6b81;padding:14px 10px 6px;}
.sidebar.collapsed .sb-section-label{display:none;}
.sb-link{
  display:flex;align-items:center;gap:12px;
  padding:10px 12px;border-radius:7px;margin-bottom:2px;
  font-size:13.5px;font-weight:500;color:#c7d0de;
  white-space:nowrap;overflow:hidden;
}
.sb-link .ico{width:20px;text-align:center;flex-shrink:0;font-size:15px;}
.sb-link:hover{background:var(--navy-panel);color:#fff;}
.sb-link.active{background:linear-gradient(90deg,rgba(255,122,26,0.22),rgba(255,122,26,0.04));color:#fff;box-shadow:inset 3px 0 0 var(--orange);}
.sb-link .badge{
  margin-left:auto;background:var(--crit);color:#fff;font-family:'IBM Plex Mono',monospace;
  font-size:10px;padding:1px 6px;border-radius:20px;
}
.sidebar.collapsed .sb-link .lbl,.sidebar.collapsed .sb-link .badge{display:none;}
.sidebar.collapsed .sb-link{justify-content:center;}

.sb-foot{padding:14px;border-top:1px solid var(--navy-line);}
.sb-admin-btn{
  width:100%;display:flex;align-items:center;gap:10px;justify-content:center;
  background:var(--navy-panel);border:1px solid var(--navy-line);color:#c7d0de;
  padding:9px;border-radius:7px;font-size:12.5px;font-weight:600;letter-spacing:0.04em;
}
.sb-admin-btn:hover{border-color:var(--orange);color:#fff;}
.sidebar.collapsed .sb-admin-btn .lbl{display:none;}

/* Mobile topbar */
.mobile-topbar{display:none;}
@media(max-width:860px){
  .sidebar{
    position:fixed;left:0;top:0;height:100vh;width:250px;
    transform:translateX(-100%);transition:transform .25s ease;
  }
  .sidebar.mobile-open{transform:translateX(0);}
  .sidebar.collapsed{width:250px;}
  .mobile-topbar{
    display:flex;align-items:center;gap:12px;
    background:var(--navy-deep);color:#fff;padding:0 14px;height:56px;
    position:sticky;top:0;z-index:35;border-bottom:1px solid var(--navy-line);
  }
  .mobile-topbar .hamburger{background:none;border:none;color:#fff;font-size:20px;padding:6px;}
  .mobile-topbar .mt-title{font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:0.06em;font-size:14px;}
  .mobile-topbar .mt-title small{display:block;font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--orange-soft);}
  .scrim{display:none;position:fixed;inset:0;background:rgba(4,10,20,0.55);z-index:39;}
  .scrim.show{display:block;}
}

/* Main */
.main{flex:1;min-width:0;}
.pagewrap{max-width:1280px;margin:0 auto;padding:26px 28px 60px;}
@media(max-width:700px){.pagewrap{padding:18px 16px 48px;}}

.page-head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:22px;}
.page-head h1{font-size:24px;color:#fff;}
.page-head .sub{color:var(--ink-dim);font-size:13px;margin-top:4px;}
.page-head .eyebrow{
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.14em;color:var(--orange-dim);margin-bottom:6px;
}

.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 18px;border-radius:7px;border:none;
  font-family:'Oswald',sans-serif;font-weight:600;font-size:12.5px;letter-spacing:0.04em;text-transform:uppercase;
}
.btn-primary{background:var(--orange);color:#fff;}
.btn-primary:hover{background:var(--orange-dim);}
.btn-outline{background:var(--bg-card);border:1px solid var(--line);color:var(--ink);}
.btn-outline:hover{border-color:var(--orange-soft);color:#fff;}
.btn-navy{background:var(--navy);color:#fff;}
.btn-navy:hover{background:var(--navy-panel);}
.btn-danger{background:var(--crit);color:#fff;}
.btn-sm{padding:7px 12px;font-size:11px;}

/* KPI cards */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px;}
@media(max-width:900px){.kpi-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:520px){.kpi-grid{grid-template-columns:1fr;}}
.kpi-card{
  background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 20px;position:relative;overflow:hidden;
}
.kpi-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--orange);}
.kpi-card.crit::before{background:var(--crit);}
.kpi-card .kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.kpi-card .kpi-icon{font-size:18px;}
.kpi-card .kpi-domain{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.1em;color:var(--ink-dim);}
.kpi-card .kpi-num{font-family:'Oswald',sans-serif;font-size:32px;font-weight:700;color:var(--orange-soft);line-height:1;}
.kpi-card .kpi-label{font-size:12px;color:var(--ink-dim);margin-top:6px;}
.kpi-card .kpi-foot{display:flex;gap:10px;margin-top:12px;font-size:11px;}
.kpi-card .kpi-foot span{display:flex;align-items:center;gap:5px;}

.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0;}
.dot.ok{background:var(--ok);box-shadow:0 0 6px var(--ok);}
.dot.warn{background:var(--warn);box-shadow:0 0 6px var(--warn);}
.dot.crit{background:var(--crit);box-shadow:0 0 6px var(--crit);animation:blink 1.1s infinite;}
.dot.off{background:var(--off);}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.25;}}

/* Panels */
.panel{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:22px;overflow:hidden;}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:10px;}
.panel-head h2{font-size:15px;color:#fff;}
.panel-body{padding:18px 20px;}

/* Dashboard live strip */
.live-strip{
  background:linear-gradient(155deg,var(--navy-panel),var(--navy-deep));
  border-radius:var(--radius);padding:18px 22px;margin-bottom:26px;color:#dfe5ee;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;
  border:1px solid var(--navy-line);
}
.live-strip .ls-left{display:flex;align-items:center;gap:12px;}
.live-strip .ls-left .lbl{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.1em;color:var(--orange-soft);}
.live-strip .ls-time{font-family:'IBM Plex Mono',monospace;font-size:12px;color:#c7d0de;}
.live-strip .ls-domains{display:flex;gap:22px;flex-wrap:wrap;}
.live-strip .ls-d{display:flex;align-items:center;gap:8px;font-size:12.5px;}
.live-strip .ls-d .n{font-family:'IBM Plex Mono',monospace;color:#fff;}

/* Alerts list on dashboard */
.alert-row{
  display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);
}
.alert-row:last-child{border-bottom:none;}
.sev-pill{
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.06em;
  padding:3px 9px;border-radius:20px;text-transform:uppercase;flex-shrink:0;
}
.sev-pill.critique{background:rgba(229,72,77,0.12);color:var(--crit);}
.sev-pill.majeure{background:rgba(245,166,35,0.14);color:#ffc857;}
.sev-pill.mineure{background:rgba(139,147,163,0.16);color:var(--ink-dim);}
.alert-row .ar-main{flex:1;min-width:0;}
.alert-row .ar-msg{font-size:13.5px;font-weight:500;}
.alert-row .ar-meta{font-size:11.5px;color:var(--ink-dim);margin-top:2px;}
.alert-row .ar-time{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-dim);white-space:nowrap;}
.empty-state{text-align:center;padding:40px 20px;color:var(--ink-dim);font-size:13px;}
.empty-state .ei{font-size:26px;margin-bottom:8px;}

/* Equipment cards */
.eq-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
.eq-counters{display:flex;gap:10px;flex-wrap:wrap;}
.count-chip{
  display:flex;align-items:center;gap:6px;background:var(--bg-card);border:1px solid var(--line);
  border-radius:20px;padding:6px 12px;font-size:12px;font-weight:500;
}
.eq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
.eq-card{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;position:relative;}
.eq-card .eqh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.eq-card .eqname{font-weight:600;font-size:14.5px;}
.eq-card .eqsite{font-size:11.5px;color:var(--ink-dim);margin-top:2px;}
.eq-card .status-tag{
  display:flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.06em;
  padding:3px 9px;border-radius:20px;
}
.status-tag.ok{background:rgba(46,204,113,0.12);color:#4ade80;}
.status-tag.alerte{background:rgba(229,72,77,0.12);color:var(--crit);}
.status-tag.hors_ligne{background:rgba(139,147,163,0.16);color:var(--ink-dim);}
.eq-params{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin:12px 0;}
.eq-params .p{font-size:12px;}
.eq-params .p .k{color:var(--ink-dim);}
.eq-params .p .v{font-family:'IBM Plex Mono',monospace;font-weight:600;}
.eq-foot{display:flex;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);}

/* Table (history) */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th{
  text-align:left;padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--line);
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.08em;color:var(--ink-dim);white-space:nowrap;
}
td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
tr:hover td{background:var(--bg-card-hover);}

/* Filters */
.filter-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.filter-bar select,.filter-bar input{
  padding:8px 12px;border:1px solid var(--line);border-radius:7px;font-size:12.5px;background:var(--bg-card);color:var(--ink);
}

/* Tabs (Configuration page) */
.tabbar{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;}
.tabbtn{
  padding:10px 16px;font-size:13px;font-weight:600;color:var(--ink-dim);border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none;
}
.tabbtn.active{color:var(--orange-dim);border-bottom-color:var(--orange);}

/* Network status rows */
.net-row{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.net-row:last-child{border-bottom:none;}
.net-row .nr-name{min-width:170px;font-weight:600;font-size:13px;}
.net-row .nr-name small{display:block;font-weight:400;color:var(--ink-dim);font-size:11px;}
.link-pill{display:flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:11px;padding:3px 9px;border-radius:20px;}
.link-pill.up{background:rgba(46,204,113,0.12);color:#4ade80;}
.link-pill.down{background:rgba(229,72,77,0.12);color:var(--crit);}
.signal-bars{display:flex;align-items:flex-end;gap:2px;height:14px;}
.signal-bars i{width:3px;background:var(--line);border-radius:1px;}
.signal-bars i:nth-child(1){height:4px;}
.signal-bars i:nth-child(2){height:7px;}
.signal-bars i:nth-child(3){height:10px;}
.signal-bars i:nth-child(4){height:14px;}
.signal-bars.s1 i:nth-child(1){background:var(--crit);}
.signal-bars.s2 i:nth-child(1),.signal-bars.s2 i:nth-child(2){background:var(--warn);}
.signal-bars.s3 i:nth-child(1),.signal-bars.s3 i:nth-child(2),.signal-bars.s3 i:nth-child(3){background:var(--ok);}
.signal-bars.s4 i{background:var(--ok);}
.net-meta{display:flex;gap:16px;font-size:11.5px;color:var(--ink-dim);flex-wrap:wrap;font-family:'IBM Plex Mono',monospace;}
.net-meta b{color:var(--ink);font-weight:600;}

/* Modal */
.modal-scrim{position:fixed;inset:0;background:rgba(8,15,30,0.55);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal-scrim.show{display:flex;}
.modal{background:var(--bg-card);border:1px solid var(--line);border-radius:12px;max-width:480px;width:100%;max-height:88vh;overflow-y:auto;}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
.modal-head h3{font-size:15px;color:#fff;}
.modal-close{background:none;border:none;font-size:18px;color:var(--ink-dim);}
.modal-body{padding:20px 22px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:600;margin-bottom:6px;color:var(--ink-dim);}
.field input,.field select,.field textarea{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:7px;font-size:13.5px;
  background:var(--bg);color:var(--ink);
}
.field input:disabled{opacity:0.6;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}

/* Admin gate */
.gate-wrap{min-height:calc(100vh - 56px);display:flex;align-items:center;justify-content:center;padding:20px;}
.gate-card{background:var(--bg-card);border:1px solid var(--line);border-radius:14px;padding:40px 34px;max-width:360px;width:100%;text-align:center;}
.gate-card .gi{width:52px;height:52px;border-radius:12px;background:linear-gradient(155deg,var(--navy),var(--navy-deep));display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:22px;color:var(--orange-soft);}
.gate-card h2{font-size:17px;color:#fff;margin-bottom:6px;}
.gate-card p{font-size:12.5px;color:var(--ink-dim);margin-bottom:20px;}
.gate-card input{
  width:100%;text-align:center;letter-spacing:0.5em;font-family:'IBM Plex Mono',monospace;font-size:20px;
  padding:12px;border:1px solid var(--line);border-radius:8px;margin-bottom:12px;
  background:var(--bg);color:var(--ink);
}
.gate-error{color:var(--crit);font-size:12px;margin-bottom:10px;display:none;}

.toast{
  position:fixed;bottom:22px;right:22px;background:var(--navy-deep);color:#fff;padding:12px 18px;border-radius:8px;
  font-size:13px;box-shadow:0 12px 30px rgba(0,0,0,0.25);z-index:200;display:flex;align-items:center;gap:10px;
  transform:translateY(20px);opacity:0;transition:all .25s ease;pointer-events:none;
}
.toast.show{transform:translateY(0);opacity:1;}
.toast .dot{background:var(--orange);}
</style>
</head>
<body>

<div id="appShell">
  <!-- SIDEBAR -->
  <nav class="sidebar" id="sidebar">
    <div class="sb-head">
      <div class="sb-logo">SC</div>
      <div class="sb-title">SPEEDCONNECT<small>PAR SDRB</small></div>
      <button class="sb-toggle" id="sbToggle" title="Réduire le menu">⟨⟨</button>
    </div>
    <div class="sb-nav" id="sbNav"></div>
    <div class="sb-foot">
      <button class="sb-admin-btn" id="adminEntryBtn"><span>🔒</span><span class="lbl">Administration</span></button>
    </div>
  </nav>
  <div class="scrim" id="scrim"></div>

  <!-- MAIN -->
  <div class="main">
    <div class="mobile-topbar">
      <button class="hamburger" id="hamburgerBtn">☰</button>
      <div class="mt-title">SPEEDCONNECT<small>PAR SDRB</small></div>
    </div>
    <div class="pagewrap" id="pageContent"></div>
  </div>
</div>

<div class="modal-scrim" id="modalScrim">
  <div class="modal" id="modalBox"></div>
</div>

<div class="toast" id="toast"><span class="dot"></span><span id="toastMsg"></span></div>

<script>
/* =========================================================
   SPEEDCONNECT — moteur d'application (données + rendu)
   ========================================================= */

const DOMAINS = {
  ssi:       {label:"Sécurité Incendie (SSI)", icon:"🔥", short:"SSI"},
  moteurs:   {label:"Moteurs Électriques",      icon:"⚙️", short:"MOTEURS"},
  ge:        {label:"Groupes Électrogènes",     icon:"🔋", short:"GE"},
  motopompes:{label:"Motopompes",               icon:"💧", short:"MOTOPOMPES"}
};

const CONNEX_TYPES = ["4G","WiFi","LoRaWAN","Satellite","Ethernet"];

function uid(prefix){ return prefix + "_" + Math.random().toString(36).slice(2,9); }
function nowISO(){ return new Date().toISOString(); }
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('fr-FR') + " " + d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}
function timeAgo(iso){
  const s = Math.floor((Date.now() - new Date(iso).getTime())/1000);
  if(s<60) return "il y a "+s+"s";
  if(s<3600) return "il y a "+Math.floor(s/60)+" min";
  if(s<86400) return "il y a "+Math.floor(s/3600)+" h";
  return "il y a "+Math.floor(s/86400)+" j";
}

/* ---------- Persistance locale ---------- */
const STORE_KEY = "speedconnect_state_v1";
function loadState(){
  const raw = localStorage.getItem(STORE_KEY);
  if(raw){ try{ return JSON.parse(raw); }catch(e){} }
  return null;
}
function saveState(){
  localStorage.setItem(STORE_KEY, JSON.stringify({
    equipments: state.equipments, alerts: state.alerts, history: state.history
  }));
}

/* ---------- Génération de données de démonstration ---------- */
function seedEquipment(){
  const sites = ["Site Marcory","Site Niamey","Base Logistique","Agence Centrale","Terminal Réseau"];
  function mkConn(){
    const type = CONNEX_TYPES[Math.floor(Math.random()*CONNEX_TYPES.length)];
    const isEth = type === "Ethernet";
    return {
      type,
      dbm: isEth ? null : -1*(50+Math.floor(Math.random()*45)),
      linkStatus: isEth ? (Math.random()>0.15?"UP":"DOWN") : null,
      ip: `10.${Math.floor(Math.random()*20)+10}.${Math.floor(Math.random()*250)}.${Math.floor(Math.random()*250)}`,
      port: [502,1883,8080,4840][Math.floor(Math.random()*4)],
      latence: Math.floor(Math.random()*140)+8,
      enLigne: Math.random() > 0.12
    };
  }
  const eqs = [];
  const specs = {
    ssi: ["Centrale CMSI Bât. A","Détecteur fumée Zone 3","UGA Sous-sol","Déclencheur manuel Hall"],
    moteurs: ["Moteur pompe HT-12","Moteur ventilation VF-04","Moteur convoyeur CV-7","Moteur compresseur K-2"],
    ge: ["GE Perkins 250kVA","GE Caterpillar 500kVA","GE Secours Site Nord","GE Secours Site Sud"],
    motopompes: ["Motopompe incendie MP-1","Motopompe forage F-3","Motopompe surpresseur SP-2","Motopompe jockey J-1"]
  };
  Object.keys(specs).forEach(domain=>{
    specs[domain].forEach((nom,i)=>{
      const r = Math.random();
      const statut = r < 0.72 ? "ok" : (r < 0.90 ? "alerte" : "hors_ligne");
      let params = {};
      if(domain==="ssi") params = {detecteurs: 24+i, zonesActives: statut==="alerte"?1:0, sprinklers:"Armé", dernierTest: "12/08/2026"};
      if(domain==="moteurs") params = {courant: (12+Math.random()*8).toFixed(1)+" A", tension:(378+Math.random()*10).toFixed(0)+" V", temperature:(48+Math.random()*30).toFixed(0)+" °C", vibration:(1+Math.random()*3).toFixed(1)+" mm/s"};
      if(domain==="ge") params = {vitesse:(1480+Math.random()*40).toFixed(0)+" tr/min", pressionHuile:(3.2+Math.random()*1.2).toFixed(1)+" bar", carburant:Math.floor(40+Math.random()*60)+" %", batterie:(12.2+Math.random()*1.1).toFixed(1)+" V"};
      if(domain==="motopompes") params = {debit:(80+Math.random()*60).toFixed(0)+" m³/h", pression:(6+Math.random()*3).toFixed(1)+" bar", vibration:(1+Math.random()*2).toFixed(1)+" mm/s", temperature:(40+Math.random()*20).toFixed(0)+" °C"};
      eqs.push({
        id: uid("eq"), domain, nom,
        site: sites[Math.floor(Math.random()*sites.length)],
        statut, params,
        connexion: mkConn(),
        derniereMaj: nowISO()
      });
    });
  });
  return eqs;
}

function seedAlerts(equipments){
  const alerts = [];
  const msgsByDomain = {
    ssi:["Zone de détection en alarme","Défaut de liaison détecteur","Batterie CMSI faible"],
    moteurs:["Surchauffe détectée","Vibration anormale","Déséquilibre de courant"],
    ge:["Survitesse moteur","Niveau de carburant bas","Batterie de démarrage faible"],
    motopompes:["Pression de refoulement basse","Vibration excessive","Perte de débit"]
  };
  equipments.filter(e=>e.statut==="alerte").forEach(e=>{
    const msgs = msgsByDomain[e.domain];
    alerts.push({
      id: uid("al"), domain:e.domain, equipmentId:e.id, equipmentNom:e.nom,
      severite: ["critique","majeure","mineure"][Math.floor(Math.random()*3)],
      message: msgs[Math.floor(Math.random()*msgs.length)],
      statut:"active",
      dateCreation: new Date(Date.now()-Math.floor(Math.random()*5*3600*1000)).toISOString(),
      dateAcquittement:null, dateResolution:null, resolutionNote:null
    });
  });
  // quelques alertes déjà traitées pour peupler l'historique
  equipments.slice(0,3).forEach(e=>{
    alerts.push({
      id: uid("al"), domain:e.domain, equipmentId:e.id, equipmentNom:e.nom,
      severite:"mineure", message:"Contrôle périodique signalé",
      statut:"resolue",
      dateCreation:new Date(Date.now()-2*86400000).toISOString(),
      dateAcquittement:new Date(Date.now()-2*86400000+3600000).toISOString(),
      dateResolution:new Date(Date.now()-86400000).toISOString(),
      resolutionNote:"Vérifié sur site, paramètres normalisés."
    });
  });
  return alerts;
}

function seedHistory(equipments, alerts){
  const h = [];
  alerts.forEach(a=>{
    h.push({id:uid("hi"), date:a.dateCreation, type:"Alerte créée", domain:a.domain, equipmentNom:a.equipmentNom, description:a.message, utilisateur:"Système"});
    if(a.dateResolution) h.push({id:uid("hi"), date:a.dateResolution, type:"Alerte résolue", domain:a.domain, equipmentNom:a.equipmentNom, description:a.resolutionNote||"", utilisateur:"Admin"});
  });
  h.push({id:uid("hi"), date:nowISO(), type:"Connexion", domain:"-", equipmentNom:"-", description:"Ouverture de l'application SpeedConnect", utilisateur:"Utilisateur"});
  return h.sort((a,b)=> new Date(b.date)-new Date(a.date));
}

/* ---------- État global ---------- */
let state = loadState();
if(!state){
  const eqs = seedEquipment();
  const alerts = seedAlerts(eqs);
  state = { equipments: eqs, alerts: alerts, history: seedHistory(eqs, alerts) };
  saveState();
}
state.route = "dashboard";
state.adminUnlocked = sessionStorage.getItem("sc_admin_ok") === "1";
state.configTab = "config";
state.alertFilters = {domain:"", severite:"", statut:""};

/* ---------- Navigation ---------- */
const NAV_ITEMS = [
  {group:"Vue d'ensemble", items:[
    {id:"dashboard", label:"Tableau de bord", icon:"🏠"}
  ]},
  {group:"Supervision", items:[
    {id:"ssi", label:DOMAINS.ssi.label, icon:DOMAINS.ssi.icon},
    {id:"moteurs", label:DOMAINS.moteurs.label, icon:DOMAINS.moteurs.icon},
    {id:"ge", label:DOMAINS.ge.label, icon:DOMAINS.ge.icon},
    {id:"motopompes", label:DOMAINS.motopompes.label, icon:DOMAINS.motopompes.icon}
  ]},
  {group:"Exploitation", items:[
    {id:"alertes", label:"Alertes", icon:"🚨"},
    {id:"historique", label:"Historique", icon:"🕘"},
    {id:"configuration", label:"Configuration", icon:"⚙️"}
  ]}
];

function activeAlertsCount(){ return state.alerts.filter(a=>a.statut==="active").length; }

function renderSidebar(){
  const nav = document.getElementById("sbNav");
  let html = "";
  NAV_ITEMS.forEach(sec=>{
    html += `<div class="sb-section-label">${sec.group}</div>`;
    sec.items.forEach(it=>{
      const badge = it.id==="alertes" && activeAlertsCount()>0 ? `<span class="badge">${activeAlertsCount()}</span>` : "";
      html += `<a href="#" class="sb-link ${state.route===it.id?'active':''}" data-route="${it.id}">
        <span class="ico">${it.icon}</span><span class="lbl">${it.label}</span>${badge}
      </a>`;
    });
  });
  nav.innerHTML = html;
  nav.querySelectorAll("[data-route]").forEach(el=>{
    el.addEventListener("click", e=>{
      e.preventDefault();
      state.route = el.getAttribute("data-route");
      document.getElementById("sidebar").classList.remove("mobile-open");
      document.getElementById("scrim").classList.remove("show");
      render();
    });
  });
}

/* ---------- Rendu par page ---------- */
function render(){
  renderSidebar();
  const el = document.getElementById("pageContent");
  switch(state.route){
    case "dashboard": el.innerHTML = pageDashboard(); break;
    case "ssi": case "moteurs": case "ge": case "motopompes": el.innerHTML = pageDomain(state.route); break;
    case "alertes": el.innerHTML = pageAlertes(); break;
    case "historique": el.innerHTML = pageHistorique(); break;
    case "configuration": el.innerHTML = pageConfiguration(); break;
    case "administration": el.innerHTML = pageAdministration(); break;
    default: el.innerHTML = pageDashboard();
  }
  bindPageEvents();
}

/* ---------- Page: Domaine (SSI / Moteurs / GE / Motopompes) ---------- */
function statusLabel(s){ return s==="ok"?"En service":(s==="alerte"?"Alerte":"Hors ligne"); }

function pageDomain(domain){
  const d = DOMAINS[domain];
  const eqs = state.equipments.filter(e=>e.domain===domain);
  const ok = eqs.filter(e=>e.statut==="ok").length;
  const al = eqs.filter(e=>e.statut==="alerte").length;
  const off = eqs.filter(e=>e.statut==="hors_ligne").length;

  const cards = eqs.map(e=>{
    const paramsHtml = Object.entries(e.params).map(([k,v])=>`<div class="p"><div class="k">${paramLabel(k)}</div><div class="v">${v}</div></div>`).join("");
    return `
    <div class="eq-card" data-eq="${e.id}">
      <div class="eqh">
        <div><div class="eqname">${e.nom}</div><div class="eqsite">${e.site}</div></div>
        <span class="status-tag ${e.statut}"><span class="dot ${e.statut==='ok'?'ok':(e.statut==='alerte'?'crit':'off')}"></span>${statusLabel(e.statut)}</span>
      </div>
      <div class="eq-params">${paramsHtml}</div>
      <div class="eq-foot">
        <button class="btn btn-sm btn-outline" data-action="edit-eq" data-id="${e.id}">Modifier</button>
        <button class="btn btn-sm btn-outline" data-action="del-eq" data-id="${e.id}">Supprimer</button>
      </div>
    </div>`;
  }).join("");

  return `
    <div class="page-head">
      <div>
        <div class="eyebrow">SUPERVISION</div>
        <h1>${d.icon} ${d.label}</h1>
        <div class="sub">Gestion complète des équipements du domaine — ${eqs.length} équipement(s).</div>
      </div>
      <button class="btn btn-primary" data-action="add-eq" data-domain="${domain}">+ Ajouter un équipement</button>
    </div>

    <div class="eq-toolbar">
      <div class="eq-counters">
        <span class="count-chip"><span class="dot ok"></span>${ok} en service</span>
        <span class="count-chip"><span class="dot crit"></span>${al} en alerte</span>
        <span class="count-chip"><span class="dot off"></span>${off} hors ligne</span>
      </div>
    </div>

    <div class="eq-grid">${cards || `<div class="empty-state"><div class="ei">📭</div>Aucun équipement enregistré pour ce domaine.</div>`}</div>
  `;
}

function paramLabel(k){
  const map = {
    detecteurs:"Détecteurs", zonesActives:"Zones en alarme", sprinklers:"Sprinklers", dernierTest:"Dernier test",
    courant:"Courant", tension:"Tension", temperature:"Température", vibration:"Vibration",
    vitesse:"Vitesse", pressionHuile:"Pression huile", carburant:"Carburant", batterie:"Batterie",
    debit:"Débit", pression:"Pression"
  };
  return map[k] || k;
}

/* ---------- Page: Alertes ---------- */

  let list = [...state.alerts].sort((a,b)=>new Date(b.dateCreation)-new Date(a.dateCreation));
  if(f.domain) list = list.filter(a=>a.domain===f.domain);
  if(f.severite) list = list.filter(a=>a.severite===f.severite);
  if(f.statut) list = list.filter(a=>a.statut===f.statut);

  const rows = list.map(a=>`
    <tr>
      <td><span class="sev-pill ${a.severite}">${a.severite}</span></td>
      <td>${DOMAINS[a.domain].short}</td>
      <td>${a.equipmentNom}</td>
      <td>${a.message}</td>
      <td>${statutAlerteLabel(a.statut)}</td>
      <td class="mono">${fmtDate(a.dateCreation)}</td>
      <td>
        ${a.statut==="active" ? `<button class="btn btn-sm btn-outline" data-action="ack-alert" data-id="${a.id}">Acquitter</button>` : ""}
        ${a.statut!=="resolue" ? `<button class="btn btn-sm btn-navy" data-action="resolve-alert" data-id="${a.id}">Résoudre</button>` : `<span class="mono" style="font-size:11px;color:var(--ink-dim);">${a.resolutionNote||''}</span>`}

  return `
    <div class="page-head">
      <div><div class="eyebrow">EXPLOITATION</div><h1>🚨 Alertes</h1><div class="sub">${list.length} alerte(s) affichée(s) sur ${state.alerts.length} au total.</div></div>

    <div class="filter-bar">
      <select id="fDomain"><option value="">Tous les domaines</option>${Object.keys(DOMAINS).map(d=>`<option value="${d}" ${f.domain===d?'selected':''}>${DOMAINS[d].label}</option>`).join("")}</select>
      <select id="fSeverite"><option value="">Toutes sévérités</option>
        <option value="critique" ${f.severite==='critique'?'selected':''}>Critique</option>
        <option value="majeure" ${f.severite==='majeure'?'selected':''}>Majeure</option>
        <option value="mineure" ${f.severite==='mineure'?'selected':''}>Mineure</option>
      </select>
      <select id="fStatut"><option value="">Tous statuts</option>
        <option value="active" ${f.statut==='active'?'selected':''}>Active</option>
        <option value="acquittee" ${f.statut==='acquittee'?'selected':''}>Acquittée</option>
        <option value="resolue" ${f.statut==='resolue'?'selected':''}>Résolue</option>

      <div class="table-wrap">
        <table>

          <tbody>${rows || `<tr><td colspan="7"><div class="empty-state"><div class="ei">🔍</div>Aucune alerte ne correspond aux filtres.</div></td></tr>`}</tbody>
        </table>

    </div>
  `;
}
function statutAlerteLabel(s){ return s==="active"?"Active":(s==="acquittee"?"Acquittée":"Résolue"); }

/* ---------- Page: Historique ---------- */
function pageHistorique(){
  const rows = state.history.map(h=>`
    <tr>
      <td class="mono">${fmtDate(h.date)}</td>
      <td>${h.type}</td>
      <td>${h.domain!=="-" ? DOMAINS[h.domain].short : "-"}</td>
      <td>${h.equipmentNom}</td>
      <td>${h.description}</td>
      <td>${h.utilisateur}</td>
    </tr>
  `).join("");

  return `
    <div class="page-head">
      <div><div class="eyebrow">EXPLOITATION</div><h1>🕘 Historique</h1><div class="sub">Traçabilité complète des événements — ${state.history.length} entrée(s) (conservation 12 mois).</div></div>
      <button class="btn btn-primary" id="exportCsvBtn">⬇ Exporter en CSV</button>
    </div>
    <div class="panel">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Date</th><th>Type</th><th>Domaine</th><th>Équipement</th><th>Description</th><th>Utilisateur</th></tr></thead>
          <tbody>${rows || `<tr><td colspan="6"><div class="empty-state">Aucun événement enregistré.</div></td></tr>`}</tbody>
        </table>
      </div>
    </div>
  `;
}

function exportHistoryCsv(){
  const header = ["Date","Type","Domaine","Equipement","Description","Utilisateur"];
  const lines = [header.join(";")];
  state.history.forEach(h=>{
    const row = [fmtDate(h.date), h.type, h.domain!=="-"?DOMAINS[h.domain].short:"-", h.equipmentNom, (h.description||"").replace(/;/g,","), h.utilisateur];
    lines.push(row.join(";"));
  });
  const blob = new Blob(["\uFEFF"+lines.join("\n")], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "speedconnect_historique_"+new Date().toISOString().slice(0,10)+".csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function signalClass(dbm){
  if(dbm===null || dbm===undefined) return "s0";
  if(dbm >= -65) return "s4";
  if(dbm >= -75) return "s3";
  if(dbm >= -90) return "s2";
  return "s1";
}

function configTabReseau(){
  const rows = state.equipments.map(e=>{
    const c = e.connexion;
    const isEth = c.type === "Ethernet";
    return `
    <div class="net-row">
      <div class="nr-name">${e.nom}<small>${DOMAINS[e.domain].short} · ${e.site}</small></div>
      <span class="link-pill ${c.enLigne?'up':'down'}"><span class="dot ${c.enLigne?'ok':'crit'}"></span>${c.enLigne?'En ligne':'Hors ligne'}</span>
      <span class="count-chip mono">${c.type}</span>
      ${isEth
        ? `<span class="link-pill ${c.linkStatus==='UP'?'up':'down'}">Link ${c.linkStatus}</span>`
        : `<div class="signal-bars ${signalClass(c.dbm)}"><i></i><i></i><i></i><i></i></div><span class="mono" style="font-size:11px;color:var(--ink-dim);">${c.dbm} dBm</span>`
      }
      <div class="net-meta">

        <span>Port <b>${c.port}</b></span>
        <span>Latence <b>${c.latence} ms</b></span>

  }).join("");

  return `

      <div class="panel-head">

      </div>
      <div class="panel-body">${rows}</div>
    </div>
  `;
}

    `;
  }

  const domainOptions = Object.keys(DOMAINS).map(d=>`<option value="${d}">${DOMAINS[d].label}</option>`).join("");
  const eqRows = state.equipments.map(e=>`
    <tr>
      <td>${e.nom}</td><td>${DOMAINS[e.domain].short}</td><td>${e.site}</td>
      <td><span class="status-tag ${e.statut}">${statusLabel(e.statut)}</span></td>
      <td>
        <button class="btn btn-sm btn-outline" data-action="edit-eq" data-id="${e.id}">Modifier</button>
        <button class="btn btn-sm btn-outline" data-action="del-eq" data-id="${e.id}">Supprimer</button>
      </td>
    </tr>
  `).join("");

  return `
    <div class="page-head">
      <div><div class="eyebrow">ADMINISTRATION</div><h1>🛠 Administration</h1><div class="sub">Gestion centralisée des équipements et création d'alertes — session déverrouillée.</div></div>
      <button class="btn btn-outline" id="adminLockBtn">🔒 Verrouiller la session</button>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Créer une alerte manuelle</h2></div>
      <div class="panel-body">
        <div class="field-row">
          <div class="field"><label>Domaine</label><select id="newAlertDomain">${domainOptions}</select></div>
          <div class="field"><label>Équipement</label><select id="newAlertEq"></select></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Sévérité</label>
            <select id="newAlertSev"><option value="mineure">Mineure</option><option value="majeure">Majeure</option><option value="critique">Critique</option></select>
          </div>
          <div class="field"><label>Message</label><input type="text" id="newAlertMsg" placeholder="Décrire l'anomalie..."></div>
        </div>
        <button class="btn btn-primary" id="createAlertBtn">Créer l'alerte</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>Équipements (${state.equipments.length})</h2>
        <div style="display:flex;gap:8px;">
          <select id="adminAddDomain">${domainOptions}</select>
          <button class="btn btn-sm btn-primary" id="adminAddEqBtn">+ Ajouter</button>
        </div>
      </div>
      <div class="table-wrap">
        <table><thead><tr><th>Nom</th><th>Domaine</th><th>Site</th><th>Statut</th><th>Actions</th></tr></thead>
        <tbody>${eqRows}</tbody></table>
      </div>
    </div>
  `;
}

/* ---------- Modales ---------- */
function openModal(html){
  document.getElementById("modalBox").innerHTML = html;
  document.getElementById("modalScrim").classList.add("show");
}
function closeModal(){ document.getElementById("modalScrim").classList.remove("show"); }

function equipmentFormModal(domain, existing){
  const isEdit = !!existing;
  const e = existing || {nom:"", site:"", statut:"ok"};
  return `
    <div class="modal-head"><h3>${isEdit?'Modifier':'Ajouter'} un équipement — ${DOMAINS[domain].label}</h3><button class="modal-close" data-action="close-modal">✕</button></div>
    <div class="modal-body">
      <div class="field"><label>Nom de l'équipement</label><input type="text" id="mEqNom" value="${e.nom}"></div>
      <div class="field"><label>Site</label><input type="text" id="mEqSite" value="${e.site}"></div>
      <div class="field"><label>Statut</label>
        <select id="mEqStatut">
          <option value="ok" ${e.statut==='ok'?'selected':''}>En service</option>
          <option value="alerte" ${e.statut==='alerte'?'selected':''}>Alerte</option>
          <option value="hors_ligne" ${e.statut==='hors_ligne'?'selected':''}>Hors ligne</option>
        </select>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" data-action="close-modal">Annuler</button>
      <button class="btn btn-primary" id="saveEqBtn" data-domain="${domain}" data-id="${isEdit?e.id:''}">Enregistrer</button>
    </div>
  `;
}

function resolveAlertModal(alertId){
  return `
    <div class="modal-head"><h3>Résoudre l'alerte</h3><button class="modal-close" data-action="close-modal">✕</button></div>
    <div class="modal-body">
      <div class="field"><label>Note de résolution</label><textarea id="mResNote" rows="4" placeholder="Décrire l'action corrective effectuée..."></textarea></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline" data-action="close-modal">Annuler</button>
      <button class="btn btn-primary" id="confirmResolveBtn" data-id="${alertId}">Confirmer la résolution</button>
    </div>
  `;
}

/* ---------- Toast ---------- */
function showToast(msg){
  const t = document.getElementById("toast");
  document.getElementById("toastMsg").textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2600);
}

/* ---------- Actions ---------- */
function addHistory(type, domain, equipmentNom, description, utilisateur){
  state.history.unshift({id:uid("hi"), date:nowISO(), type, domain, equipmentNom, description, utilisateur});
}

function deleteEquipment(id){
  const eq = state.equipments.find(e=>e.id===id);
  if(!eq) return;
  if(!confirm(`Supprimer l'équipement "${eq.nom}" ?`)) return;
  state.equipments = state.equipments.filter(e=>e.id!==id);
  addHistory("Équipement supprimé", eq.domain, eq.nom, "Suppression manuelle", "Admin");
  saveState(); render(); showToast("Équipement supprimé.");
}

function saveEquipmentFromModal(){
  const domain = document.getElementById("saveEqBtn").getAttribute("data-domain");
  const id = document.getElementById("saveEqBtn").getAttribute("data-id");
  const nom = document.getElementById("mEqNom").value.trim();
  const site = document.getElementById("mEqSite").value.trim();
  const statut = document.getElementById("mEqStatut").value;
  if(!nom){ alert("Le nom de l'équipement est requis."); return; }

  if(id){
    const eq = state.equipments.find(e=>e.id===id);
    eq.nom=nom; eq.site=site; eq.statut=statut; eq.derniereMaj=nowISO();
    addHistory("Équipement modifié", domain, nom, "Mise à jour manuelle", "Admin");
    showToast("Équipement mis à jour.");
  } else {
    const newEq = {
      id: uid("eq"), domain, nom, site, statut, params:{},
      connexion:{type:"WiFi", dbm:-70, linkStatus:null, ip:"10.10.0."+Math.floor(Math.random()*250), port:1883, latence:35, enLigne:true},
      derniereMaj: nowISO()
    };
    state.equipments.push(newEq);
    addHistory("Équipement ajouté", domain, nom, "Création manuelle", "Admin");
    showToast("Équipement ajouté.");
  }
  saveState(); closeModal(); render();
}

function ackAlert(id){
  const a = state.alerts.find(x=>x.id===id);
  if(!a) return;
  a.statut = "acquittee"; a.dateAcquittement = nowISO();
  addHistory("Alerte acquittée", a.domain, a.equipmentNom, a.message, "Opérateur");
  saveState(); render(); showToast("Alerte acquittée.");
}

function confirmResolve(id){
  const a = state.alerts.find(x=>x.id===id);
  if(!a) return;
  const note = document.getElementById("mResNote").value.trim();
  a.statut = "resolue"; a.dateResolution = nowISO(); a.resolutionNote = note || "Résolue.";
  addHistory("Alerte résolue", a.domain, a.equipmentNom, a.resolutionNote, "Admin");
  saveState(); closeModal(); render(); showToast("Alerte résolue et documentée.");
}

function createManualAlert(){
  const domain = document.getElementById("newAlertDomain").value;
  const eqId = document.getElementById("newAlertEq").value;
  const sev = document.getElementById("newAlertSev").value;
  const msg = document.getElementById("newAlertMsg").value.trim();
  const eq = state.equipments.find(e=>e.id===eqId);
  if(!eq || !msg){ alert("Veuillez sélectionner un équipement et saisir un message."); return; }
  const alert_ = {id:uid("al"), domain, equipmentId:eq.id, equipmentNom:eq.nom, severite:sev, message:msg, statut:"active", dateCreation:nowISO(), dateAcquittement:null, dateResolution:null, resolutionNote:null};
  state.alerts.unshift(alert_);
  addHistory("Alerte créée", domain, eq.nom, msg, "Admin");
  saveState(); render(); showToast("Alerte créée.");
}

function populateEqSelectForDomain(){
  const domainSel = document.getElementById("newAlertDomain");
  const eqSel = document.getElementById("newAlertEq");
  if(!domainSel || !eqSel) return;
  const domain = domainSel.value;
  const opts = state.equipments.filter(e=>e.domain===domain).map(e=>`<option value="${e.id}">${e.nom}</option>`).join("");
  eqSel.innerHTML = opts;
}

/* ---------- Liaison des événements par page ---------- */
function bindPageEvents(){
  document.getElementById("refreshBtn")?.addEventListener("click", ()=>{ simulateLiveUpdate(); render(); showToast("Données actualisées."); });

  document.querySelectorAll('[data-route]').forEach(el=>{
    if(el.tagName==="A" && el.getAttribute("data-route")){
      el.addEventListener("click", e=>{ e.preventDefault(); state.route = el.getAttribute("data-route"); render(); });
    }
  });

  document.querySelectorAll('[data-action="add-eq"]').forEach(el=>{
    el.addEventListener("click", ()=> openModal(equipmentFormModal(el.getAttribute("data-domain"), null)));
  });
  document.querySelectorAll('[data-action="edit-eq"]').forEach(el=>{
    el.addEventListener("click", ()=>{
      const eq = state.equipments.find(e=>e.id===el.getAttribute("data-id"));
      openModal(equipmentFormModal(eq.domain, eq));
    });
  });
  document.querySelectorAll('[data-action="del-eq"]').forEach(el=>{
    el.addEventListener("click", ()=> deleteEquipment(el.getAttribute("data-id")));
  });
  document.getElementById("saveEqBtn")?.addEventListener("click", saveEquipmentFromModal);
  document.querySelectorAll('[data-action="close-modal"]').forEach(el=> el.addEventListener("click", closeModal));

  document.querySelectorAll('[data-action="ack-alert"]').forEach(el=>{
    el.addEventListener("click", ()=> ackAlert(el.getAttribute("data-id")));
  });
  document.querySelectorAll('[data-action="resolve-alert"]').forEach(el=>{
    el.addEventListener("click", ()=> openModal(resolveAlertModal(el.getAttribute("data-id"))));
  });
  document.getElementById("confirmResolveBtn")?.addEventListener("click", function(){ confirmResolve(this.getAttribute("data-id")); });

  ["fDomain","fSeverite","fStatut"].forEach(id=>{
    document.getElementById(id)?.addEventListener("change", function(){
      state.alertFilters.domain = document.getElementById("fDomain").value;
      state.alertFilters.severite = document.getElementById("fSeverite").value;
      state.alertFilters.statut = document.getElementById("fStatut").value;
      render();
    });
  });

  document.getElementById("exportCsvBtn")?.addEventListener("click", exportHistoryCsv);

  document.querySelectorAll(".tabbtn").forEach(el=>{
    el.addEventListener("click", ()=>{ state.configTab = el.getAttribute("data-tab"); render(); });
  });

  document.getElementById("adminSubmit")?.addEventListener("click", submitAdminCode);
  document.getElementById("adminCode")?.addEventListener("keydown", e=>{ if(e.key==="Enter") submitAdminCode(); });
  document.getElementById("adminLockBtn")?.addEventListener("click", ()=>{
    state.adminUnlocked = false; sessionStorage.removeItem("sc_admin_ok");
    state.route = "dashboard"; render(); showToast("Session administrateur verrouillée.");
  });

  document.getElementById("newAlertDomain")?.addEventListener("change", populateEqSelectForDomain);
  populateEqSelectForDomain();
  document.getElementById("createAlertBtn")?.addEventListener("click", createManualAlert);
  document.getElementById("adminAddEqBtn")?.addEventListener("click", ()=>{
    openModal(equipmentFormModal(document.getElementById("adminAddDomain").value, null));
  });
}

function submitAdminCode(){
  const val = document.getElementById("adminCode").value;
  if(val === "2208"){
    state.adminUnlocked = true; sessionStorage.setItem("sc_admin_ok","1");
    addHistory("Connexion admin", "-", "-", "Accès administration autorisé", "Admin");
    saveState(); render();
  } else {
    document.getElementById("adminError").style.display = "block";
    document.getElementById("adminCode").value = "";
  }
}

/* ---------- Simulation temps réel ---------- */
function simulateLiveUpdate(){
  state.equipments.forEach(e=>{
    if(e.connexion.dbm !== null){ e.connexion.dbm = Math.max(-110, Math.min(-40, e.connexion.dbm + (Math.random()*10-5)|0)); }
    e.connexion.latence = Math.max(5, e.connexion.latence + Math.floor(Math.random()*16-8));
    e.derniereMaj = nowISO();
  });
  saveState();
}
setInterval(()=>{
  simulateLiveUpdate();
  if(state.route === "dashboard" || state.route === "configuration"){ render(); }
  else {
    const clock = document.getElementById("liveClock");
    if(clock) clock.textContent = new Date().toLocaleTimeString('fr-FR');
  }
}, 5000);

/* ---------- Menu latéral (desktop collapse / mobile drawer) ---------- */
document.getElementById("sbToggle").addEventListener("click", ()=>{
  document.getElementById("sidebar").classList.toggle("collapsed");
});
document.getElementById("hamburgerBtn").addEventListener("click", ()=>{
  document.getElementById("sidebar").classList.add("mobile-open");
  document.getElementById("scrim").classList.add("show");
});
document.getElementById("scrim").addEventListener("click", ()=>{
  document.getElementById("sidebar").classList.remove("mobile-open");
  document.getElementById("scrim").classList.remove("show");
});
document.getElementById("adminEntryBtn").addEventListener("click", ()=>{
  state.route = "administration"; render();
  document.getElementById("sidebar").classList.remove("mobile-open");
  document.getElementById("scrim").classList.remove("show");
});
document.getElementById("modalScrim").addEventListener("click", e=>{ if(e.target.id==="modalScrim") closeModal(); });

/* ---------- Démarrage ---------- */
render();
</script>
</body>
</html>
